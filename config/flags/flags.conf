# =============================================================================
# STGR Browser - launch flag set (source of truth)
# =============================================================================
# Rendered into per-platform launchers by scripts/render-launchers.py.
# Never edit a generated launcher; edit this file and re-render.
#
# SYNTAX
#   [profile:name]     start a profile
#   @include <name>    merge another profile in place
#   --switch           one switch per line, no quotes, no backslashes
#   # ...              comment
#
# IMPORTANT
#   * Chromium honours only the LAST occurrence of a switch, so every feature
#     list must live on a single line. Do not split --disable-features.
#   * Duplicate switches across @include chains are de-duplicated by the
#     renderer, last one wins.
#   * Anything that increases CPU or battery burn (--disable-renderer-backgrounding,
#     --disable-background-timer-throttling) is BANNED here. They feel fast and
#     cost watts; a gaming browser cannot afford them.
# =============================================================================

[profile:common]
# --- first run / chrome noise -------------------------------------------------
--no-first-run
--no-default-browser-check
--no-service-autorun
--disable-default-apps
--disable-component-extensions-with-background-pages
--bookmark-bar-ntp=false

# --- telemetry, crash reporting, background chatter ---------------------------
# Guaranteed layer. Enterprise policies in config/policies/ add a second layer
# where the OS lets an installer write them.
--disable-background-networking
--disable-domain-reliability
--disable-breakpad
--disable-crash-reporter
--metrics-recording-only
--no-pings
--disable-sync
--disable-logging
--log-level=3
--disable-component-update

# --- privacy ------------------------------------------------------------------
# Safe Browsing lookups are disabled here and re-implemented locally by
# extensions/stgr-shield (blocklist matching, no URL leaves the machine).
--disable-client-side-phishing-detection
--disable-features=OptimizationHints,OptimizationGuideModelDownloading,InterestFeedContentSuggestions,MediaRouter,PrivacySandboxSettings4,AutofillServerCommunication,CertificateTransparencyComponentUpdater,Translate

# --- AI surfaces ---------------------------------------------------------------
# Chromium keeps adding on-device and server-backed AI features: "help me write",
# AI history search, AI wallpaper, AI autofill, on-device model downloads. None
# of them belong in a browser whose pitch is "lightweight", and several of them
# fetch model weights in the background.
#
# Chromium ignores feature names it does not recognise, so this list is safe to
# over-specify: a name that lands in a future build starts being disabled, and a
# name that never ships costs nothing.
--disable-features=Compose,ComposeProactiveNudge,ComposeTextProofreading,ComposeInlineCompose,HistoryEmbeddings,HistoryEmbeddingsAnswers,OptimizationGuideOnDeviceModel,OptimizationGuideModelDownloading,WallpaperSearch,CreateTheme,ChromeCreateTheme,TabOrganization,AutofillPredictionImprovements,NtpFooter

# --- rendering smoothness -----------------------------------------------------
--enable-gpu-rasterization
--enable-zero-copy
--enable-native-gpu-memory-buffers
--enable-accelerated-video-decode
--enable-smooth-scrolling
--num-raster-threads=4
--enable-features=CanvasOopRasterization,ParallelDownloading

# --- network ------------------------------------------------------------------
--enable-quic
--dns-over-https-mode=automatic

# --- disk footprint -----------------------------------------------------------
--disk-cache-size=268435456
--media-cache-size=67108864

[profile:balanced]
# DEFAULT. Keeps Chromium site isolation intact: one renderer process per site,
# not per tab. This is the correct default for a browser people log into things
# with. Memory wins come from aggressive tab discarding instead.
@include common
--renderer-process-limit=10
--enable-features=CanvasOopRasterization,ParallelDownloading,HighEfficiencyModeAvailable

[profile:lowmem]
# "STGR Browser (Low RAM)" shortcut. Opt-in, because it trades process isolation
# for memory: --process-per-site collapses every tab of the same site into one
# renderer, and bfcache/prerender are switched off so background tabs stop
# holding whole page trees alive. Read docs/PERFORMANCE.md before changing.
@include common
--process-per-site
--renderer-process-limit=4
--enable-low-end-device-mode
--js-flags=--max-old-space-size=1024
--disable-features=OptimizationHints,OptimizationGuideModelDownloading,InterestFeedContentSuggestions,MediaRouter,PrivacySandboxSettings4,AutofillServerCommunication,CertificateTransparencyComponentUpdater,Translate,BackForwardCache,Prerender2,SpeculationRulesPrefetchFuture
--enable-features=CanvasOopRasterization,ParallelDownloading,HighEfficiencyModeAvailable
--disk-cache-size=134217728

[profile:debug]
# Local QA only. Never ship: opens remote debugging and keeps verbose logs.
@include common
--enable-logging=stderr
--v=1
--remote-debugging-port=9222
