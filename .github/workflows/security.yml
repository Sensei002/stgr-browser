name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # weekly

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Forbid secret material in the tree
        shell: bash
        run: |
          set -e
          HITS=$(find . -path ./firefox -prune -o -type f \( \
            -name '*.pfx' -o -name '*.p12' -o -name '*.key' -o -name '*.pem' \
            -o -name '*.keystore' -o -name '.env' \) -print)
          if [ -n "$HITS" ]; then
            echo "Secret file(s) present in the repository:"; echo "$HITS"
            exit 1
          fi
          echo "no secret files found"

      - name: Verify no signing material in git history
        shell: bash
        run: |
          if git rev-list --all --oneline -- '*.pfx' '*.p12' '*.key' | grep -q .; then
            echo "signing material found in history — rotate secrets"; exit 1
          fi
          echo "history clean"
