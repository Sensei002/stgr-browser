name: Build Windows x64

# Reusable workflow (called by release.yml and manually).
# Least privilege: contents: read — no write permissions on build.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: "dev"
  workflow_dispatch:

permissions:
  contents: read

# Python on the Windows runner pipes stdout as cp1252; our scripts print
# non-cp1252 glyphs (✅/❌/—/…) — force UTF-8 mode so builds never die on
# encoding errors.
env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
env:
  MOZCONFIG: ${{ github.workspace }}/stgr/build/mozconfig.windows-x64-release
  # NOTE: no MOZ_AUTOMATION here. mach on Windows asserts MozillaBuild is
  # installed (C:\mozilla-build) on every invocation; bootstrap below must
  # run in a normal context. build_stgr.py sets MOZ_AUTOMATION=1 for the
  # build/package steps itself (MozillaBuild exists by then).
    steps:
      - uses: actions/checkout@v4

      - name: Cache Firefox source (git objects)
        uses: actions/cache@v4
        with:
          path: firefox/.git
          key: firefox-git-${{ runner.os }}-${{ hashFiles('stgr/config/stgr-config.json') }}
          restore-keys: |
            firefox-git-${{ runner.os }}-

      - name: Sync Firefox Stable source
        shell: bash
        run: python scripts/update_firefox.py sync

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('firefox/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install MozillaBuild (Windows mach prerequisite)
        # Firefox's mach asserts C:\mozilla-build exists on every Windows run;
        # unlike Linux/macOS, `mach bootstrap` does NOT install it, so it must
        # be installed manually first (official Windows build prerequisite).
        # Bump the version here when Firefox requires a newer MozillaBuild.
        shell: pwsh
        run: |
          $ver = "4.2.1"
          $setup = "$env:RUNNER_TEMP\MozillaBuildSetup-$ver.exe"
          if (-not (Test-Path $setup)) {
            Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-$ver.exe" -OutFile $setup
          }
          Write-Host "Installing MozillaBuild $ver silently..."
          Start-Process -FilePath $setup -ArgumentList "/S" -Wait
          if (-not (Test-Path "C:\mozilla-build")) { throw "MozillaBuild install failed: C:\mozilla-build missing" }
          Write-Host "MozillaBuild installed at C:\mozilla-build"

      - name: Bootstrap build tooling
        shell: bash
        run: |
          cd firefox
          python mach bootstrap --no-interactive --application-choice=browser \
            || python mach bootstrap --application-choice=browser

      - name: Apply STGR patches
        shell: bash
        run: python scripts/apply_patches.py apply

      - name: Build
        shell: bash
        run: python scripts/build_stgr.py build

      - name: Package (installer + checksums + manifest)
        shell: bash
        run: python scripts/build_stgr.py package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stgr-win64
          path: |
            releases/*.exe
            releases/*.zip
            releases/SHA256SUMS.txt
            releases/build-manifest.json
          retention-days: 14
